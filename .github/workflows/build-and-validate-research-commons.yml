name: Build and validate Research Commons

on:
  push:
    paths:
      - "research_commons/**"
      - "RESEARCH_COMMONS_MIRROR_HANDOFF.md"
      - ".github/workflows/build-and-validate-research-commons.yml"
  pull_request:
    paths:
      - "research_commons/**"
      - "RESEARCH_COMMONS_MIRROR_HANDOFF.md"
      - ".github/workflows/build-and-validate-research-commons.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse all Research Commons JSON contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('research_commons').rglob('*.json'))
          for path in files:
              json.loads(path.read_text())
          print(f'parsed {len(files)} JSON files')
          PY
      - name: Build deterministic indexes and canonical registry receipt
        run: python research_commons/tools/build_publisher_indexes.py
      - name: Validate Publisher paper registry
        run: python research_commons/tools/validate_publisher_papers.py
      - name: Validate source-neutral Published Research Graph
        run: python research_commons/tools/validate_published_research_graph.py
      - name: Prove unreviewed machine candidate cannot be admitted
        run: |
          set +e
          output=$(python research_commons/tools/validate_published_research_graph.py --graph research_commons/published_research_graph/fixtures/invalid-machine-admitted-without-review.json 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F "machine-discovered admitted relation RC-REL-FIXTURE-UNREVIEWED-PROMOTION requires accepted review evidence"
      - name: Prove accepted review can promote machine candidate
        run: python research_commons/tools/validate_published_research_graph.py --graph research_commons/published_research_graph/fixtures/valid-machine-promoted-after-review.json
      - name: Prove rejected review preserves rejected machine state
        run: python research_commons/tools/validate_published_research_graph.py --graph research_commons/published_research_graph/fixtures/valid-machine-rejected-after-review.json
      - name: Detect duplicate records
        run: python research_commons/tools/detect_duplicates.py
      - name: Validate Site projection boundary
        run: python research_commons/tools/validate_site_projection.py
      - name: Build fail-closed Site dispatch packet
        run: python research_commons/tools/build_site_projection_dispatch.py
      - name: Validate Research Commons control state
        run: python research_commons/tools/check_research_commons_control_state.py
      - name: Upload generated validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: research-commons-validation
          path: |
            research_commons/indexes/publisher-papers/*.json
            research_commons/sources/publisher-papers/registry-hash-receipt.json
            research_commons/reports/duplicate-detection.json
            research_commons/projection/site-projection-dispatch-packet.json
            research_commons/published_research_graph/graph.json
            research_commons/published_research_graph/fixtures/*.json
          if-no-files-found: error
