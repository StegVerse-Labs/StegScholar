name: Rigel validation

on:
  workflow_dispatch:
    inputs:
      episodes:
        description: "Episode count for the validation run"
        required: false
        default: "10000"
      ablation_scenarios:
        description: "Matched scenarios for the constant-total-latency ablation"
        required: false
        default: "2000"
      bootstrap_replicates:
        description: "Bootstrap replicates for held-out baseline intervals"
        required: false
        default: "500"
  push:
    branches: [main]
    paths:
      - "papers/recoverability-geometry-rigel-number/simulations/**"
      - ".github/workflows/rigel-validation.yml"
      - "coordination/rigel-validation-tasks.json"
  pull_request:
    paths:
      - "papers/recoverability-geometry-rigel-number/simulations/**"
      - ".github/workflows/rigel-validation.yml"
      - "coordination/rigel-validation-tasks.json"

permissions:
  contents: write

concurrency:
  group: rigel-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic tests
        run: |
          python papers/recoverability-geometry-rigel-number/simulations/test_scalar_delayed_control.py

      - name: Resolve run sizes
        id: run_sizes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "episodes=${{ inputs.episodes }}" >> "$GITHUB_OUTPUT"
            echo "ablation_scenarios=${{ inputs.ablation_scenarios }}" >> "$GITHUB_OUTPUT"
            echo "bootstrap_replicates=${{ inputs.bootstrap_replicates }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "episodes=1000" >> "$GITHUB_OUTPUT"
            echo "ablation_scenarios=250" >> "$GITHUB_OUTPUT"
            echo "bootstrap_replicates=200" >> "$GITHUB_OUTPUT"
          else
            echo "episodes=10000" >> "$GITHUB_OUTPUT"
            echo "ablation_scenarios=2000" >> "$GITHUB_OUTPUT"
            echo "bootstrap_replicates=500" >> "$GITHUB_OUTPUT"
          fi

      - name: Run scalar benchmark
        run: |
          python papers/recoverability-geometry-rigel-number/simulations/scalar_delayed_control.py \
            --episodes "${{ steps.run_sizes.outputs.episodes }}" \
            --seed 20260714 \
            --output-dir generated/scalar-delayed-control

      - name: Fit held-out latency baselines
        run: |
          python papers/recoverability-geometry-rigel-number/simulations/fit_baselines.py \
            --episodes-csv generated/scalar-delayed-control/episodes.csv \
            --output generated/scalar-delayed-control/baseline-evaluation.json \
            --bootstrap-replicates "${{ steps.run_sizes.outputs.bootstrap_replicates }}" \
            --seed 20260714

      - name: Run constant-total-latency ablation
        run: |
          python papers/recoverability-geometry-rigel-number/simulations/constant_total_latency_ablation.py \
            --scenarios "${{ steps.run_sizes.outputs.ablation_scenarios }}" \
            --seed 20260714 \
            --total-latency 0.45 \
            --output-dir generated/constant-total-latency-ablation

      - name: Evaluate fail-closed validation state
        run: |
          python papers/recoverability-geometry-rigel-number/simulations/evaluate_validation_state.py \
            --baseline-metrics generated/scalar-delayed-control/baseline-evaluation.json \
            --ablation-summary generated/constant-total-latency-ablation/summary.json \
            --output generated/validation-state.json

      - name: Create validation receipts
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          runs = [
              {
                  "benchmark_id": "rigel-scalar-delayed-control-v1",
                  "output": Path("generated/scalar-delayed-control"),
                  "files": ["config.json", "episodes.csv", "summary.json", "baseline-evaluation.json"],
                  "command": (
                      "python papers/recoverability-geometry-rigel-number/simulations/"
                      "scalar_delayed_control.py --episodes "
                      "${{ steps.run_sizes.outputs.episodes }} --seed 20260714 "
                      "--output-dir generated/scalar-delayed-control; then fit_baselines.py"
                  ),
              },
              {
                  "benchmark_id": "rigel-constant-total-latency-ablation-v1",
                  "output": Path("generated/constant-total-latency-ablation"),
                  "files": ["config.json", "episodes.csv", "summary.json"],
                  "command": (
                      "python papers/recoverability-geometry-rigel-number/simulations/"
                      "constant_total_latency_ablation.py --scenarios "
                      "${{ steps.run_sizes.outputs.ablation_scenarios }} --seed 20260714 "
                      "--total-latency 0.45 "
                      "--output-dir generated/constant-total-latency-ablation"
                  ),
              },
          ]

          for run in runs:
              output = run["output"]
              files = [output / name for name in run["files"]]
              hashes = {}
              for path in files:
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  hashes[str(path)] = {"sha256": digest, "bytes": path.stat().st_size}

              receipt = {
                  "schema_version": "1.2",
                  "benchmark_id": run["benchmark_id"],
                  "generated_at_utc": datetime.now(timezone.utc).isoformat(),
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "commit_sha": os.environ.get("GITHUB_SHA"),
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                  "event_name": os.environ.get("GITHUB_EVENT_NAME"),
                  "python": "3.12",
                  "command": run["command"],
                  "independent_outcome_label": True,
                  "files": hashes,
                  "validation_state_path": "generated/validation-state.json",
                  "claim_limit": (
                      "This receipt proves deterministic execution and artifact identity only; "
                      "it does not establish cross-domain validity or a universal Ri=1 threshold."
                  ),
              }
              (output / "validation-receipt.json").write_text(
                  json.dumps(receipt, indent=2, sort_keys=True), encoding="utf-8"
              )
          PY

      - name: Display summaries and state
        run: |
          echo "Scalar benchmark summary"
          cat generated/scalar-delayed-control/summary.json
          echo "Held-out fitted baseline evaluation"
          cat generated/scalar-delayed-control/baseline-evaluation.json
          echo "Constant-total-latency ablation summary"
          cat generated/constant-total-latency-ablation/summary.json
          echo "Fail-closed validation state"
          cat generated/validation-state.json

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: rigel-validation-${{ github.sha }}
          path: |
            generated/scalar-delayed-control/config.json
            generated/scalar-delayed-control/episodes.csv
            generated/scalar-delayed-control/summary.json
            generated/scalar-delayed-control/baseline-evaluation.json
            generated/scalar-delayed-control/validation-receipt.json
            generated/constant-total-latency-ablation/config.json
            generated/constant-total-latency-ablation/episodes.csv
            generated/constant-total-latency-ablation/summary.json
            generated/constant-total-latency-ablation/validation-receipt.json
            generated/validation-state.json
          if-no-files-found: error
          retention-days: 30

      - name: Persist compact validation evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          destination="evidence/rigel-validation/latest"
          mkdir -p "$destination"
          cp generated/scalar-delayed-control/summary.json "$destination/scalar-summary.json"
          cp generated/scalar-delayed-control/baseline-evaluation.json "$destination/baseline-evaluation.json"
          cp generated/scalar-delayed-control/validation-receipt.json "$destination/scalar-validation-receipt.json"
          cp generated/constant-total-latency-ablation/summary.json "$destination/ablation-summary.json"
          cp generated/constant-total-latency-ablation/validation-receipt.json "$destination/ablation-validation-receipt.json"
          cp generated/validation-state.json "$destination/validation-state.json"

          git config user.name "stegverse-validation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$destination"
          if git diff --cached --quiet; then
            echo "No compact evidence changes to persist."
            exit 0
          fi
          git commit -m "Persist Rigel validation evidence for run $GITHUB_RUN_ID"
          git push origin HEAD:main
