name: Reconcile StegVerse GTG task registry

on:
  push:
    branches: [main]
    paths:
      - 'coordination/gtg-*-task.json'
      - 'coordination/gtg-*-validation-receipt.json'
      - 'coordination/gtg-reconstruction-tasks.json'
      - 'coordination/gtg-task-discovery-standard.md'
      - 'scripts/reconcile_gtg_task_registry.py'
      - '.github/workflows/reconcile-gtg-task-registry.yml'
  pull_request:
    paths:
      - 'coordination/gtg-*-task.json'
      - 'coordination/gtg-*-validation-receipt.json'
      - 'coordination/gtg-reconstruction-tasks.json'
      - 'coordination/gtg-task-discovery-standard.md'
      - 'scripts/reconcile_gtg_task_registry.py'
      - '.github/workflows/reconcile-gtg-task-registry.yml'
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile local GTG tasks
        run: python scripts/reconcile_gtg_task_registry.py
      - name: Publish discovery report
        uses: actions/upload-artifact@v4
        with:
          name: gtg-task-discovery-report
          path: coordination/gtg-task-discovery-report.json
