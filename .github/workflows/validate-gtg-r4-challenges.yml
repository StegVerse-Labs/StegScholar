name: Validate StegVerse GTG R4 challenges

on:
  push:
    branches: [main]
    paths:
      - 'papers/generalized-transition-governance/reconstruction/r4-challenge-corpus.md'
      - 'coordination/gtg-r4-challenge-cases.json'
      - 'scripts/validate_gtg_r4_challenges.py'
      - '.github/workflows/validate-gtg-r4-challenges.yml'
  pull_request:
    paths:
      - 'papers/generalized-transition-governance/reconstruction/r4-challenge-corpus.md'
      - 'coordination/gtg-r4-challenge-cases.json'
      - 'scripts/validate_gtg_r4_challenges.py'
      - '.github/workflows/validate-gtg-r4-challenges.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_gtg_r4_challenges.py
