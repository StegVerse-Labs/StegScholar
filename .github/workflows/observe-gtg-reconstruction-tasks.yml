name: Observe GTG reconstruction tasks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  pull_request:
    paths:
      - 'coordination/gtg-reconstruction-tasks.json'
      - 'scripts/run_gtg_task_orchestrator.py'
      - '.github/workflows/observe-gtg-reconstruction-tasks.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/gtg-reconstruction-tasks.json'
      - 'scripts/run_gtg_task_orchestrator.py'
      - '.github/workflows/observe-gtg-reconstruction-tasks.yml'

permissions:
  contents: read

jobs:
  observe-and-select-next-work:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe dependencies and expose executable StegVerse tasks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/run_gtg_task_orchestrator.py
      - name: Publish task report
        uses: actions/upload-artifact@v4
        with:
          name: gtg-reconstruction-task-report
          path: coordination/gtg-reconstruction-task-report.json
          if-no-files-found: error
      - name: Write actionable tasks to workflow summary
        run: |
          echo '## GTG reconstruction execution queue' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('coordination/gtg-reconstruction-task-report.json').read_text())
          print(f"Factory R4 observation: `{report['factory_r4_observation']['state']}`")
          for task in report['actionable_tasks']:
              print(f"- **{task['task_id']}**")
              print(f"  - Exists at: `{task['exists_at']}`")
              print(f"  - Execute at: `{task['execution_path']}`")
              print(f"  - Next action: {task['next_action']}")
          PY
