name: Funding Deadline Watch

on:
  schedule:
    - cron: "15 13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "funding/applications/active/**"
      - "funding/coordination/funding-tasks.json"
      - "funding/tools/check_funding_deadlines.py"
      - ".github/workflows/funding-deadline-watch.yml"
  pull_request:
    paths:
      - "funding/applications/active/**"
      - "funding/coordination/funding-tasks.json"
      - "funding/tools/check_funding_deadlines.py"
      - ".github/workflows/funding-deadline-watch.yml"
      - "funding/evidence/deadline-watch-validation-request.md"

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check application deadlines and active claims
        run: python funding/tools/check_funding_deadlines.py
      - name: Upload deadline-watch receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-deadline-watch
          path: funding/evidence/latest-deadline-watch.json
          if-no-files-found: error
