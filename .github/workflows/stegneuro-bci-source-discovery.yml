name: StegNeuro BCI Source Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'research_commons/protocols/generalized-research-discovery.md'
      - 'research_commons/topics/STEGNEURO-BCI-001/**'
      - 'research_commons/tools/discover_sources.py'
      - 'research_commons/tools/triage_sources.py'
      - 'research_commons/tools/build_continuation_state.py'
      - '.github/workflows/stegneuro-bci-source-discovery.yml'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate canonical reviewed research inputs
        run: |
          python -m json.tool research_commons/topics/STEGNEURO-BCI-001/registry.json >/dev/null
          python -m json.tool research_commons/topics/STEGNEURO-BCI-001/reviewed-sources-2026-08-09.json >/dev/null
          python -m json.tool research_commons/topics/STEGNEURO-BCI-001/search-plan.json >/dev/null
      - name: Discover candidate current sources
        run: |
          python research_commons/tools/discover_sources.py \
            --plan research_commons/topics/STEGNEURO-BCI-001/search-plan.json \
            --out generated/stegneuro-bci/candidate-sources.json
      - name: Triage metadata and build evidence gap map
        run: |
          python research_commons/tools/triage_sources.py \
            --candidates generated/stegneuro-bci/candidate-sources.json \
            --registry research_commons/topics/STEGNEURO-BCI-001/registry.json \
            --reviewed-additions research_commons/topics/STEGNEURO-BCI-001/reviewed-sources-2026-08-09.json \
            --triage-out generated/stegneuro-bci/source-triage.json \
            --gap-out generated/stegneuro-bci/gap-map.json
      - name: Build persistent continuation state and review queues
        run: |
          python research_commons/tools/build_continuation_state.py \
            --triage generated/stegneuro-bci/source-triage.json \
            --gap-map generated/stegneuro-bci/gap-map.json \
            --out research_commons/runtime/STEGNEURO-BCI-001/continuation-latest.json
      - name: Verify fail-closed discovery posture
        run: |
          python - <<'PY'
          import json
          p = json.load(open('generated/stegneuro-bci/candidate-sources.json'))
          t = json.load(open('generated/stegneuro-bci/source-triage.json'))
          g = json.load(open('generated/stegneuro-bci/gap-map.json'))
          c = json.load(open('research_commons/runtime/STEGNEURO-BCI-001/continuation-latest.json'))
          assert p['authority_effect'] == 'NONE'
          assert p['auto_merge_into_registry'] is False
          assert p['state'] == 'REVIEW_REQUIRED'
          assert p['candidate_count'] > 0
          assert t['authority_effect'] == 'NONE' and t['registry_effect'] == 'NONE'
          assert g['authority_effect'] == 'NONE'
          assert g['reviewed_source_count'] >= 19
          assert set(i['classification'] for i in t['items']) <= {'ADMIT_SOURCE','REJECT_SOURCE','SUPERSEDED','DUPLICATE','RETRY'}
          assert c['authority_effect'] == 'NONE' and c['registry_effect'] == 'NONE'
          assert c['owner'] == 'StegVerse-Labs/StegScholar#50'
          print('candidate discovery + triage + continuation: fail-closed')
          PY
      - name: Persist changed continuation state
        run: |
          git config user.name 'stegverse-continuation-bot'
          git config user.email '210078727+StegVerse@users.noreply.github.com'
          if git diff --quiet -- research_commons/runtime/STEGNEURO-BCI-001/continuation-latest.json && git ls-files --error-unmatch research_commons/runtime/STEGNEURO-BCI-001/continuation-latest.json >/dev/null 2>&1; then
            echo 'Continuation state unchanged.'
          else
            git add research_commons/runtime/STEGNEURO-BCI-001/continuation-latest.json
            git commit -m 'automation: persist StegNeuro BCI continuation state'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stegneuro-bci-source-evidence
          path: |
            generated/stegneuro-bci/candidate-sources.json
            generated/stegneuro-bci/source-triage.json
            generated/stegneuro-bci/gap-map.json
            research_commons/runtime/STEGNEURO-BCI-001/continuation-latest.json
          if-no-files-found: error
